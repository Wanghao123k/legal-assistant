<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>法律助手（测试版）</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #f5f6f8;
    height: 100vh;
    display: flex; flex-direction: column;
  }
  header {
    background: #1e3a5f; color: #fff;
    padding: 14px 20px; font-size: 16px; font-weight: 600;
  }
  header span { font-size: 12px; font-weight: 400; opacity: .7; margin-left: 8px; }
  #chat {
    flex: 1; overflow-y: auto; padding: 20px;
    width: 100%; max-width: 800px; margin: 0 auto;
  }
  .msg { margin-bottom: 16px; display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble {
    max-width: 78%; padding: 10px 14px; border-radius: 12px;
    line-height: 1.65; white-space: pre-wrap; word-break: break-word; font-size: 14px;
  }
  .msg.user .bubble { background: #1e3a5f; color: #fff; border-bottom-right-radius: 4px; }
  .msg.bot .bubble { background: #fff; color: #333; border: 1px solid #e5e7eb; border-bottom-left-radius: 4px; }
  footer { padding: 12px 20px; background: #fff; border-top: 1px solid #e5e7eb; }
  #input-row { max-width: 800px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
  #input {
    flex: 1; padding: 12px 14px; border: 1px solid #d1d5db; border-radius: 8px;
    font-size: 14px; resize: none; outline: none; font-family: inherit; max-height: 120px;
  }
  #input:focus { border-color: #1e3a5f; }
  #send {
    padding: 12px 22px; background: #1e3a5f; color: #fff; border: none;
    border-radius: 8px; font-size: 14px; cursor: pointer; flex-shrink: 0;
  }
  #send:disabled { background: #9ca3af; cursor: not-allowed; }
</style>
</head>
<body>
<header>⚖️ 法律助手 <span>测试版 · 无 RAG</span></header>
<div id="chat"></div>
<footer>
  <div id="input-row">
    <textarea id="input" rows="1" placeholder="输入你的法律问题，回车发送（Shift+回车换行）"></textarea>
    <button id="send">发送</button>
  </div>
</footer>
<script>
  const chat = document.getElementById('chat');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const messages = [];  // 前端维护完整对话历史，每次整体发送

  function addMsg(role, text) {
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + role;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    wrap.appendChild(bubble);
    chat.appendChild(wrap);
    chat.scrollTop = chat.scrollHeight;
    return bubble;
  }

  function autoResize() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  }
  input.addEventListener('input', autoResize);

  async function send() {
    const text = input.value.trim();
    if (!text || sendBtn.disabled) return;
    input.value = ''; autoResize();
    addMsg('user', text);
    messages.push({ role: 'user', content: text });

    const botBubble = addMsg('bot', '');
    sendBtn.disabled = true;
    let full = '';

    try {
      const resp = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages })
      });
      if (!resp.ok) throw new Error('HTTP ' + resp.status);

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const parts = buffer.split('\n\n');
        buffer = parts.pop();
        for (const part of parts) {
          const line = part.trim();
          if (!line.startsWith('data:')) continue;
          const payload = line.slice(5).trim();
          if (payload === '[DONE]') continue;
          try {
            const obj = JSON.parse(payload);
            if (obj.content) { full += obj.content; botBubble.textContent = full; chat.scrollTop = chat.scrollHeight; }
            if (obj.error) botBubble.textContent = '出错了：' + obj.error;
          } catch (e) { /* 忽略不完整 JSON */ }
        }
      }
    } catch (e) {
      botBubble.textContent = '请求失败：' + e.message;
    } finally {
      if (full) messages.push({ role: 'assistant', content: full });
      sendBtn.disabled = false;
      input.focus();
    }
  }

  sendBtn.addEventListener('click', send);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });

  addMsg('bot', '你好！我是法律助手（测试版）。有什么法律问题可以问我，我会尽量用大白话解答。\n\n（本回答仅供参考，不构成正式法律意见）');
</script>
</body>
</html>
