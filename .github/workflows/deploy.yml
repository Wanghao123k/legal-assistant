name: Deploy to Aliyun

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Let an active deployment finish before starting the next one.
concurrency:
  group: aliyun-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build and check the combined frontend/backend image
        run: |
          set -euo pipefail
          bash -n scripts/deploy.sh
          docker build --pull -t "legal-assistant:$GITHUB_SHA" .
          docker run -d --name smoke-test "legal-assistant:$GITHUB_SHA"
          trap 'docker rm -f smoke-test >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if docker exec smoke-test python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=2).close()"; then
              exit 0
            fi
            sleep 2
          done
          docker logs --tail 100 smoke-test
          exit 1

      # Transfer the built image so ECS does not need to reach GitHub or a registry.
      - name: Export image
        run: |
          set -euo pipefail
          docker save "legal-assistant:$GITHUB_SHA" | gzip > "$RUNNER_TEMP/image.tar.gz"

      - name: Upload and deploy over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Set SSH_HOST in repository secrets}"
          : "${SSH_USER:?Set SSH_USER in repository secrets}"
          : "${SSH_PRIVATE_KEY:?Set SSH_PRIVATE_KEY in repository secrets}"
          : "${SSH_KNOWN_HOSTS:?Set SSH_KNOWN_HOSTS in repository secrets}"
          SSH_PORT="${SSH_PORT:-22}"
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$SSH_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"
          trap 'rm -f "$HOME/.ssh/deploy_key"' EXIT
          ssh_options=(-i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          target="$SSH_USER@$SSH_HOST"
          upload_dir="/opt/legal-assistant/incoming/$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh "${ssh_options[@]}" -p "$SSH_PORT" "$target" "umask 077; mkdir -p '$upload_dir'"
          scp "${ssh_options[@]}" -P "$SSH_PORT" "$RUNNER_TEMP/image.tar.gz" scripts/deploy.sh "$target:$upload_dir/"
          ssh "${ssh_options[@]}" -p "$SSH_PORT" "$target" "bash '$upload_dir/deploy.sh' '$GITHUB_SHA' '$upload_dir/image.tar.gz'"
          ssh "${ssh_options[@]}" -p "$SSH_PORT" "$target" "rm -f '$upload_dir/image.tar.gz' '$upload_dir/deploy.sh'; rmdir '$upload_dir'"
