name: Deploy to Aliyun

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Let an active deployment finish before starting the next one.
concurrency:
  group: aliyun-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare model environment from GitHub configuration
        env:
          LLM_API_KEY: ${{ vars.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -n "$LLM_API_KEY" ]]; then
            printf '::add-mask::%s\n' "$LLM_API_KEY"
          fi
          python - <<'PY'
          import os
          from pathlib import Path

          values = {}
          for name in ("LLM_API_KEY", "LLM_BASE_URL", "LLM_MODEL"):
              value = os.environ.get(name, "").strip()
              if name == "LLM_API_KEY" and not value:
                  raise SystemExit("Set LLM_API_KEY in the production Environment variables before deploying.")
              if any(char in value for char in ("\r", "\n", "\x00")):
                  raise SystemExit(f"{name} must be a single-line value.")
              if value:
                  values[name] = value
          path = Path(os.environ["RUNNER_TEMP"]) / "legal-assistant-runtime.env"
          path.write_text("".join(f"{name}={value}\n" for name, value in values.items()), encoding="utf-8")
          path.chmod(0o600)
          PY

      - name: Build and check the combined frontend/backend image
        run: |
          set -euo pipefail
          bash -n scripts/deploy.sh
          docker build --pull -t "legal-assistant:$GITHUB_SHA" .
          docker run -d --name smoke-test "legal-assistant:$GITHUB_SHA"
          trap 'docker rm -f smoke-test >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if docker exec smoke-test python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=2).close()"; then
              exit 0
            fi
            sleep 2
          done
          docker logs --tail 100 smoke-test
          exit 1

      # Transfer the built image so ECS does not need to reach GitHub or a registry.
      - name: Export image
        run: |
          set -euo pipefail
          docker save "legal-assistant:$GITHUB_SHA" | gzip > "$RUNNER_TEMP/image.tar.gz"

      - name: Upload and deploy over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER || 'deploy' }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Set SSH_HOST in production environment secrets or repository secrets}"
          : "${SSH_USER:?Set SSH_USER in production environment secrets or repository secrets}"
          : "${SSH_PRIVATE_KEY:?Set SSH_PRIVATE_KEY in production environment secrets or repository secrets}"
          : "${SSH_KNOWN_HOSTS:?Set SSH_KNOWN_HOSTS in production environment secrets or repository secrets}"
          SSH_PORT="${SSH_PORT:-22}"
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$SSH_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]

          install -d -m 700 "$HOME/.ssh"
          # Restore line wrapping when a terminal/browser copied the key onto one line.
          python - <<'PY'
          import base64
          import os
          from pathlib import Path
          import re
          import textwrap

          raw = os.environ["SSH_PRIVATE_KEY"].replace("\\r", "").replace("\\n", "\n")
          match = re.search(r"-----BEGIN OPENSSH PRIVATE KEY-----\s*(.*?)\s*-----END OPENSSH PRIVATE KEY-----", raw, re.S)
          # A copied base64 body is usable only if it decodes to the OpenSSH key format.
          body = "".join((match.group(1) if match else raw).split())
          try:
              decoded = base64.b64decode(body, validate=True)
          except ValueError:
              raise SystemExit("SSH_PRIVATE_KEY contains invalid or incomplete base64 data.") from None
          if not decoded.startswith(b"openssh-key-v1\x00"):
              raise SystemExit("SSH_PRIVATE_KEY is not a valid OpenSSH private key.")
          key_path = Path.home() / ".ssh" / "deploy_key"
          key_path.touch(mode=0o600)
          key_path.write_text("-----BEGIN OPENSSH PRIVATE KEY-----\n" + textwrap.fill(body, 70) + "\n-----END OPENSSH PRIVATE KEY-----\n")
          PY
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"
          cleanup() {
            status=$?
            trap - EXIT
            if [[ -n "${upload_dir:-}" ]]; then
              ssh "${ssh_options[@]}" -p "$SSH_PORT" "$target" "rm -f '$upload_dir/runtime.env'" >/dev/null 2>&1 || true
            fi
            rm -f "$HOME/.ssh/deploy_key" "$RUNNER_TEMP/legal-assistant-runtime.env"
            exit "$status"
          }
          trap cleanup EXIT
          if ! ssh-keygen -y -P '' -f "$HOME/.ssh/deploy_key" >/dev/null; then
            echo 'SSH_PRIVATE_KEY is damaged or password-protected. Use the original complete unencrypted deployment private key.' >&2
            exit 1
          fi
          ssh_options=(-i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          target="$SSH_USER@$SSH_HOST"
          upload_dir="/opt/legal-assistant/incoming/$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh "${ssh_options[@]}" -p "$SSH_PORT" "$target" "umask 077; mkdir -p '$upload_dir'"
          scp "${ssh_options[@]}" -P "$SSH_PORT" "$RUNNER_TEMP/image.tar.gz" scripts/deploy.sh "$target:$upload_dir/"
          ssh "${ssh_options[@]}" -p "$SSH_PORT" "$target" "umask 077; cat > '$upload_dir/runtime.env'" < "$RUNNER_TEMP/legal-assistant-runtime.env"
          ssh "${ssh_options[@]}" -p "$SSH_PORT" "$target" "bash '$upload_dir/deploy.sh' '$GITHUB_SHA' '$upload_dir/image.tar.gz' '$upload_dir/runtime.env'"
          ssh "${ssh_options[@]}" -p "$SSH_PORT" "$target" "rm -f '$upload_dir/image.tar.gz' '$upload_dir/deploy.sh'; rmdir '$upload_dir'"

      - name: Remove temporary deployment credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/legal-assistant-runtime.env" "$HOME/.ssh/deploy_key"
